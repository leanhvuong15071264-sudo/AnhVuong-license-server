<!-- =========================
     DOWNLOAD DIALOG (Admin)
========================= -->
<dialog id="downloadDialog">

  <form id="downloadForm" class="dialog">

    <button type="button" class="dialog-close" data-close="downloadDialog">
      ×
    </button>

    <span class="eyebrow">DOWNLOAD MANAGER</span>
    <h2 id="downloadDialogTitle">Thêm mục tải xuống</h2>

    <label>Tên</label>
    <input id="downloadTitle" maxlength="120" required>

    <label>Mô tả</label>
    <textarea id="downloadDescription" maxlength="2000"></textarea>

    <label>Link hình ảnh</label>
    <input id="downloadImage" maxlength="2000" placeholder="https://...">

    <label>Link tải xuống</label>
    <input id="downloadUrl" maxlength="2000" placeholder="https://..." required>

    <label>Giá</label>
    <input id="downloadPrice" maxlength="50" placeholder="MIỄN PHÍ">

    <label>Phiên bản</label>
    <input id="downloadVersion" maxlength="50" placeholder="1.0.0">

    <label>Dung lượng</label>
    <input id="downloadFileSize" maxlength="50" placeholder="1 tập tin">

    <label>Discord</label>
    <input id="downloadDiscord" maxlength="200" placeholder="Vai trò + kênh">

    <label>Tiêu đề mô tả thêm</label>
    <input id="downloadExtraTitle" maxlength="100" placeholder="GIỚI THIỆU VỀ BẢN MOD NÀY">

    <label>Nội dung mô tả thêm</label>
    <textarea id="downloadExtraDescription" maxlength="500" placeholder="Thạch Chi Khong Biet"></textarea>

    <label>Khóa bản quyền hiển thị</label>
    <input id="downloadLicenseKey" maxlength="50" placeholder="VNT-XXXX-XXXX-XXXX">

    <label>Thông tin vận chuyển</label>
    <input id="downloadShipping" maxlength="100" placeholder="truy cập tức">

    <input id="downloadId" type="hidden">

    <div class="dialog-buttons">
      <button type="button" class="secondary-btn" id="downloadCancel">
        Hủy
      </button>

      <button class="primary-btn" type="submit">
        Lưu
      </button>
    </div>

  </form>

</dialog>
